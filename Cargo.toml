[package]
name = "srok"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "srok"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8.17" }
leptos_router = { version = "0.8.13" }
leptos_meta = { version = "0.8.6" }

# SSR-specific
axum = { version = "0.8.8", optional = true }
tokio = { version = "1.51", features = ["rt-multi-thread"], optional = true }
leptos_axum = { version = "0.8.8", optional = true }
leptos-use = { version = "0.18.3", optional = true }
quick_cache = { version = "0.6.21", optional = true }
dotenv = { version = "0.15", optional = true }
env_logger = { version = "0.11.10", optional = true }
openapi = { version = "0.1.5", optional = true }

# Hydration/WebAssembly-specific
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen = { version = "=0.2.117", optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
web-sys = { version = "0.3.94", features = ["Window","Storage"] }
tower-http = { version = "0.6.8", features = ["cors"] }
serde_json = "1.0.149"
serde = "1.0.228"
log = "0.4.29"
serde_repr = "0.1.20"
url = "2.5.8"
serde_with = "3.18.0"
async-trait = "0.1.89"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:quick_cache",
    "dep:dotenv",
    "dep:env_logger",
    "dep:openapi",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos-use/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "srok"
style-file = "style/srok.scss"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
hash-files = true